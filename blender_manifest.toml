schema_version = "1.0.0"
id = "local_character"
version = "0.13.0"
name = "Rigmodo"
tagline = "Local AI rigging, skinning, motion and Unity character exports"
maintainer = "Rigmodo contributors"
type = "add-on"
blender_version_min = "5.2.0"
blender_version_max = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]
tags = ["Rigging", "Animation", "Import-Export"]
platforms = ["windows-x64"]
[permissions]
files = "Read local AI weights and write character proposals and exports"
network = "Download pinned models and runtimes during provider setup"
[build]
paths_exclude_pattern = [".*", "__pycache__/", "tests/", "tools/", "native/", "docs/", "unity/", "artifacts/", "*.zip", "*.log"]
